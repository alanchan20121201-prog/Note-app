<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Local Notes</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f7f7f7;
            color: #333;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        .sidebar {
            width: 340px;
            background: #fff;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
        }
        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .sidebar-header h3 {
            font-size: 16px;
            font-weight: 600;
        }
        .btn-new {
            background: #111;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }
        .btn-new:hover {
            background: #333;
        }
        .tabs {
            display: flex;
            background: #f1f1f1;
            border-bottom: 1px solid #ddd;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            text-align: center;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 13px;
            color: #666;
            font-weight: 500;
        }
        .tab-btn.active {
            background: #fff;
            color: #111;
            border-bottom: 2px solid #111;
        }
        .note-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        .note-item {
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 6px;
            transition: background 0.15s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .note-item:hover {
            background: #f0f0f0;
        }
        .note-item.active {
            background: #e6e6e6;
        }
        .note-info {
            flex: 1;
            overflow: hidden;
            padding-right: 10px;
        }
        .note-title {
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .note-date {
            font-size: 12px;
            color: #777;
            margin-top: 2px;
        }
        .note-actions {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .btn-icon {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            padding: 4px 6px;
            border-radius: 4px;
            color: #555;
        }
        .btn-icon:hover {
            background: #ddd;
        }
        .btn-delete:hover {
            color: #d93838;
            background: #fdf2f2;
        }
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #fafafa;
            padding: 30px;
            overflow-y: auto;
        }
        .editor-container {
            max-width: 700px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        input, textarea {
            font-size: 15px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            background: #fff;
        }
        input:focus, textarea:focus {
            border-color: #333;
        }
        textarea {
            resize: vertical;
            height: 350px;
            font-family: inherit;
        }
        .row {
            display: flex;
            gap: 10px;
        }
        .row input {
            flex: 1;
        }
        .actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            align-items: center;
        }
        .status-text {
            font-size: 13px;
            color: #4caf50;
            display: none;
        }
        .btn-save {
            background-color: #111;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
        }
        .btn-save:hover {
            background-color: #333;
        }
        .error-msg {
            color: #d93838;
            font-size: 14px;
            background-color: #fdf2f2;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #f9c6c6;
            display: none;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <h3 id="sidebarTitle">History Notes</h3>
            <button class="btn-new" onclick="createNewNote()">+ New</button>
        </div>
        
        <div class="tabs">
            <button class="tab-btn active" id="tabNotes" onclick="switchTab('notes')">Notes</button>
            <button class="tab-btn" id="tabTrash" onclick="switchTab('trash')">Trash</button>
        </div>

        <div class="note-list" id="noteList"></div>
    </div>

    <div class="main-content">
        <div class="editor-container">
            <div id="errorBox" class="error-msg"></div>

            <input type="text" id="title" placeholder="Enter title...">
            
            <div class="row">
                <input type="date" id="noteDate">
                <input type="time" id="noteTime">
            </div>

            <textarea id="content" placeholder="Write your thoughts here..."></textarea>
            
            <div class="actions">
                <span id="saveStatus" class="status-text">Saved to local history</span>
                <button class="btn-save" onclick="saveNote()">Save to Local History</button>
            </div>
        </div>
    </div>

    <!-- 引入外部 JS 檔案 -->
    <script src="renderer.js"></script>
</body>
</html>
